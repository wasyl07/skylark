# Skylark: SSH host keys and root's authorized_keys live on /data so they
# survive RAUC slot switches (each slot has its own rootfs).
#   /etc/dropbear -> /data/ssh/dropbear, /root/.ssh -> /data/ssh/root
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/sh -c 'mkdir -p /data/ssh/dropbear /data/ssh/root && chmod 700 /data/ssh /data/ssh/root'
