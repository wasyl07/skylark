[system]
compatible=skylark-bbb
bootloader=uboot
mountprefix=/run/rauc
# central slot status on /data (per-slot status files need a writable slot mount)
statusfile=/data/rauc.status
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
